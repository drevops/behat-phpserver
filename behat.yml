default:
  autoload: ['%paths.base%/tests/behat/bootstrap']
  gherkin:
    # One cache directory per parsing mode, so a parse from another mode is
    # never reused.
    cache: '%paths.base%/.artifacts/tmp/gherkin-cache/gherkin-32'
    compatibility: gherkin-32
    filters:
      tags: '~@skipped'
  testers:
    strict: true
  suites:
    default:
      paths: ['%paths.base%/tests/behat/features']
      contexts:
        - DrevOps\BehatPhpServer\PhpServerContext:
            webroot: '%paths.base%/tests/behat/fixtures'
            protocol: http
            host: 0.0.0.0
            port: 8888
            debug: true
        - DrevOps\BehatPhpServer\ApiServerContext:
            webroot: '%paths.base%/apiserver'
            protocol: http
            host: 0.0.0.0
            port: 8889
            debug: true
            paths:
              - '%paths.base%/tests/behat/fixtures'
              - '%paths.base%/tests/behat/fixtures2'
        - FeatureContext
  extensions:
    Behat\MinkExtension:
      sessions:
        default:
          browserkit_http: ~
    DVDoug\Behat\CodeCoverage\Extension:
      filter:
        include:
          directories:
            '%paths.base%/src': ~
      reports:
        text:
          showColors: true
          showOnlySummary: true
        html:
          target: '%paths.base%/.logs/behat/.coverage-html'
        cobertura:
          target: '%paths.base%/.logs/behat/cobertura.xml'

  formatters:
    pretty: true
    junit:
      output_path: '%paths.base%/.logs/behat/test_results'
